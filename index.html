<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tambahan tag meta ini berfungsi untuk memicu pembaruan commit (deploy baru) di GitHub -->
    <meta name="description" content="DIPANA - Digital Pengelolaan Absensi dan Nilai Akademik MAN 1 Kota Cirebon">
    <title>DIPANA - Digital Pengelolaan Absensi dan Nilai Akademik</title>
    
    <!-- Google Fonts & FontAwesome untuk Ikon -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #F4F4F4; 
            font-family: 'Montserrat', sans-serif; 
        }
        
        /* Layar pemuatan Full Video */
        #loading-screen {
            position: fixed;
            inset: 0;
            background-color: #F4F4F4; 
            z-index: 999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #loading-screen video {
            width: 80%;
            max-width: 500px;
            height: auto;
            object-fit: contain;
        }
        
        /* Bingkai aplikasi utama yang memenuhi layar */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Animasi Loading Full Video -->
    <div id="loading-screen">
        <video autoplay loop muted playsinline>
            <source src="https://raw.githubusercontent.com/suframdhan/AKSARA/refs/heads/main/DIPANA.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Iframe dengan URL Web App Google Apps Script Anda -->
    <iframe id="app-frame" src="https://script.google.com/macros/s/AKfycbxVZrWrcTD-fjNi8qeYIKyBrE9TEFvX1JdBVRzQM1gNhDcavIdx51FR5w9Xqba50rAFxA/exec" 
            onload="const screen = document.getElementById('loading-screen'); screen.style.opacity='0'; setTimeout(()=>screen.style.visibility='hidden', 500);"
            allow="fullscreen; camera; microphone; clipboard-read; clipboard-write">
    </iframe>

</body>
</html>
