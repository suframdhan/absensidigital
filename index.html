<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKSARA DIGITALISASI ABSENSI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #F8FAFC; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.4s ease;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #E2E8F0;
            border-top: 4px solid #0d9488;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Animasi loading awal -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <h3 style="color: #0f172a; font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: 0.05em;">AKSARA DIGITAL ABSENSI</h3>
        <p style="color: #64748b; font-size: 11px; margin-top: 4px; font-weight: 600;">MAN 1 KOTA CIREBON</p>
    </div>

    <!-- Iframe dengan URL Web App Google Apps Script terbaru Anda -->
    <iframe id="app-frame" src="https://script.google.com/macros/s/AKfycbxwdw9jDFZDlM8lAoggSMIGZFKtzyVITyMq-6-XPr1RFMrlYwLD4ZlUbquWb86XVJfOYA/exec" 
            onload="document.getElementById('loading-screen').style.opacity='0'; setTimeout(()=>document.getElementById('loading-screen').style.display='none', 400);"
            allow="fullscreen; camera; microphone; clipboard-read; clipboard-write">
    </iframe>

    <script>
        // Penanganan pengaman jika iframe mendeteksi blokir bingkai dari Google
        const iframe = document.getElementById('app-frame');
        iframe.onerror = function() {
            console.warn("Gagal memuat iframe langsung, mengalihkan ke mode langsung...");
            window.location.href = iframe.src;
        };
    </script>

</body>
</html>
